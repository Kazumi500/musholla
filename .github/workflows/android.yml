name: Cetak APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cetak-apk
  cancel-in-progress: true

jobs:
  cetak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Periksa kode
        run: flutter analyze

      - name: Jalankan tes
        run: flutter test

      - name: Cetak APK
        run: flutter build apk --release

      - name: Simpan APK sebagai hasil cetakan
        uses: actions/upload-artifact@v7
        with:
          name: absensi-sholat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Terbitkan tautan unduh untuk HP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK cetakan ke-${{ github.run_number }}
          body: Cetakan otomatis dari GitHub Actions. Buka berkas di bawah dari HP, lalu pasang.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
