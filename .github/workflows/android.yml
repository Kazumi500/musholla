name: Cetak APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cetak-apk
  cancel-in-progress: true

jobs:
  cetak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Periksa kode
        run: flutter analyze

      - name: Jalankan tes
        run: flutter test

      - name: Siapkan kunci tanda tangan rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Rahasia kunci rilis belum diisi; APK akan bertanda tangan debug dan bisa bentrok saat dipasang di HP."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/absensi-release.p12
          {
            echo "storeFile=absensi-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Cetak APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Periksa tanda tangan APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            echo "::warning::apksigner tidak ditemukan; tanda tangan tidak diperiksa."
          fi

      - name: Simpan APK sebagai hasil cetakan
        uses: actions/upload-artifact@v7
        with:
          name: absensi-sholat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Terbitkan tautan unduh untuk HP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK cetakan ke-${{ github.run_number }}
          body: Cetakan otomatis dari GitHub Actions. Buka berkas di bawah dari HP, lalu pasang.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
